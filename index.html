<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музейный Гид — ИИ Генератор</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #F5F0E8;
    --bg-card: #FDFAF4;
    --text-main: #1A1208;
    --text-muted: #6B5E45;
    --text-light: #9C8E77;
    --accent: #8B5E3C;
    --accent-light: #D4A574;
    --accent-pale: #F0E4D0;
    --border: #DDD0B8;
    --gold: #C9963A;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
  }

  .grain {
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 3rem 2rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .header-ornament {
    font-family: serif;
    color: var(--gold);
    font-size: 1.2rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    line-height: 1.15;
    color: var(--text-main);
    margin-bottom: 0.75rem;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 300;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.6;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
  }

  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 3rem 2rem;
    text-align: center;
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent-light);
    background: #FDF6EC;
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .upload-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 1.25rem;
    background: var(--accent-pale);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .upload-icon svg {
    width: 26px;
    height: 26px;
    stroke: var(--accent);
  }

  .upload-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 0.4rem;
    color: var(--text-main);
  }

  .upload-hint {
    font-size: 0.85rem;
    color: var(--text-light);
  }

  .config-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  label {
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  input[type="text"], input[type="password"], select, textarea {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text-main);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent-light);
  }

  .api-row {
    margin-top: 1rem;
  }

  .generate-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    width: 100%;
    margin-top: 1.75rem;
    padding: 1rem;
    background: var(--accent);
    color: #FDF6EC;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .generate-btn:hover { background: #7A4F2E; transform: translateY(-1px); }
  .generate-btn:active { transform: translateY(0); }
  .generate-btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; transform: none; }

  .generate-btn .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  .generate-btn.loading .spinner { display: block; }
  .generate-btn.loading .btn-text { opacity: 0.7; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .file-info {
    display: none;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--accent-pale);
    border-radius: 8px;
    margin-top: 1rem;
    font-size: 0.88rem;
  }

  .file-info.visible { display: flex; }

  .file-name {
    flex: 1;
    font-weight: 500;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .remove-file {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-light);
    font-size: 1.1rem;
    padding: 0;
    line-height: 1;
    transition: color 0.2s;
  }

  .remove-file:hover { color: var(--text-main); }

  .results-section {
    margin-top: 3rem;
    display: none;
  }

  .results-section.visible { display: block; }

  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .results-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem;
    font-weight: 700;
  }

  .results-count {
    font-size: 0.85rem;
    color: var(--text-light);
  }

  .controls-bar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    padding: 0.45rem 1rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .ctrl-btn:hover { border-color: var(--accent-light); color: var(--accent); }

  .exhibits-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .exhibit-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .exhibit-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .exhibit-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 36px;
  }

  .exhibit-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 500;
    flex: 1;
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .copy-btn:hover { border-color: var(--accent-light); color: var(--accent); }
  .copy-btn.copied { color: #4a7c59; border-color: #4a7c59; }

  .exhibit-body {
    padding: 1.5rem;
  }

  .guide-text {
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--text-main);
    font-weight: 300;
  }

  .error-box {
    background: #FDF0EF;
    border: 1px solid #F0B5B0;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    color: #8B3A35;
    font-size: 0.9rem;
    margin-top: 1rem;
    display: none;
  }

  .error-box.visible { display: block; }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--border);
    margin: 2.5rem auto;
  }

  .print-area { display: none; }

  @media print {
    .print-area { display: block; }
    .no-print { display: none; }
  }

  @media (max-width: 600px) {
    .config-row { grid-template-columns: 1fr; }
    header { padding: 2rem 1.25rem 1.5rem; }
    main { padding: 2rem 1.25rem 3rem; }
  }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 0;
  }
  .nav-tab {
    flex: 1;
    max-width: 200px;
    padding: 0.75rem 1rem;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-light);
    cursor: pointer;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: color 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
  }
  .nav-tab svg { width: 20px; height: 20px; stroke: currentColor; }
  .nav-tab.active { color: var(--accent); border-top: 2px solid var(--accent); margin-top: -1px; }
  .tab-page { display: none; }
  .tab-page.active { display: block; }
  body { padding-bottom: 70px; }

  /* ── Video tab ── */
  .video-upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 3rem 2rem;
    text-align: center;
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .video-upload-zone:hover { border-color: var(--accent-light); background: #FDF6EC; }
  .video-upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .fps-row { display: flex; align-items: center; gap: 1rem; margin-top: 1rem; }
  .fps-row label { font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); white-space: nowrap; }
  .fps-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .fps-val { font-size: 0.9rem; font-weight: 500; color: var(--accent); min-width: 60px; }
  .progress-bar-wrap { background: var(--border); border-radius: 99px; height: 6px; margin-top: 1rem; overflow: hidden; display: none; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.1s; }
  .frame-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 1rem; max-height: 200px; overflow-y: auto; }
  .frame-preview img { width: 80px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>



<div id="tab-guide" class="tab-page active">
<main class="no-print">
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.csv,.json,.md" />
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10,9 9,9 8,9"/>
      </svg>
    </div>
    <p class="upload-title">Перетащите файл или нажмите</p>
    <p class="upload-hint">TXT, PDF, DOCX, CSV, JSON, MD — любой текстовый формат</p>
  </div>

  <div class="file-info" id="fileInfo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/>
    </svg>
    <span class="file-name" id="fileName">файл.txt</span>
    <button class="remove-file" id="removeFile" title="Удалить файл">✕</button>
  </div>

<div class="config-row" style="margin-top:1rem;">
    <div class="field">
      <label>Стиль текста гида</label>
      <select id="guideStyle">
        <option value="engaging">Увлекательный и живой</option>
        <option value="academic">Академический, подробный</option>
        <option value="storytelling">Рассказ-история</option>
        <option value="kids">Для детей и семей</option>
        <option value="short">Краткий (2–3 предложения)</option>
      </select>
    </div>
    <div class="field">
      <label>Язык текстов</label>
      <select id="outputLang">
        <option value="russian">Русский</option>
        <option value="kazakh">Қазақша</option>
        <option value="english">English</option>
      </select>
    </div>
  </div>



  <div class="error-box" id="errorBox"></div>

  <button class="generate-btn" id="generateBtn" disabled>
    <div class="spinner"></div>
    <span class="btn-text">✦ Создать тексты гида</span>
  </button>
</main>

<div class="divider no-print"></div>

<section class="results-section" id="resultsSection">
  <div style="max-width: 860px; margin: 0 auto; padding: 0 2rem 4rem;">
    <div class="results-header">
      <h2 class="results-title">Тексты экскурсовода</h2>
      <span class="results-count" id="resultsCount"></span>
    </div>
    <div class="controls-bar">
      <button class="ctrl-btn" onclick="copyAll()">Скопировать всё</button>
      <button class="ctrl-btn" onclick="window.print()">Распечатать</button>
    </div>
    <div class="exhibits-list" id="exhibitsList"></div>
  </div>
</section>
</div><!-- /tab-guide -->

<div id="tab-video" class="tab-page">
<main style="max-width:860px;margin:0 auto;padding:2rem 2rem 4rem;position:relative;z-index:1;">
  <div class="video-upload-zone" id="videoZone">
    <input type="file" id="videoInput" accept="video/*" />
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;stroke:var(--accent)">
        <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
    </div>
    <p class="upload-title" style="font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:500;margin-bottom:.4rem;">Перетащите видео или нажмите</p>
    <p style="font-size:.85rem;color:var(--text-light)">MP4, AVI, MOV, MKV, WebM</p>
  </div>

  <div id="videoFileInfo" class="file-info" style="display:none;margin-top:1rem;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="5" width="15" height="14" rx="2"/><polygon points="23 7 16 12 23 17 23 7"/></svg>
    <span id="videoFileName" style="flex:1;font-weight:500;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    <button onclick="clearVideo()" style="background:none;border:none;cursor:pointer;color:var(--text-light);font-size:1.1rem;">✕</button>
  </div>

  <div class="config-row" style="margin-top:1.5rem;">
    <div class="field">
      <label>Название класса (объекта)</label>
      <input type="text" id="className" placeholder="exhibit, painting, artifact..." value="exhibit" style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:.65rem .9rem;font-family:inherit;font-size:.9rem;color:var(--text-main);outline:none;width:100%;" />
    </div>
    <div class="field">
      <label>Авторазметка через ИИ</label>
      <select id="annotateMode" style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:.65rem .9rem;font-family:inherit;font-size:.9rem;color:var(--text-main);outline:none;width:100%;">
        <option value="auto">Да — Gemini найдёт объект</option>
        <option value="none">Нет — только кадры без разметки</option>
      </select>
    </div>
  </div>
  <div class="fps-row" style="margin-top:1rem;">
    <label>Кадров в секунду (FPS):</label>
    <input type="range" id="fpsRange" min="1" max="30" value="1" oninput="document.getElementById('fpsVal').textContent=this.value+' fps'" />
    <span class="fps-val" id="fpsVal">1 fps</span>
  </div>
  <div style="margin-top:.5rem;font-size:.8rem;color:var(--text-light);">1–5 fps обычно хватает для YOLO датасета. ZIP будет разделён 70% train / 20% valid / 10% test.</div>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div id="progressLabel" style="font-size:.82rem;color:var(--text-muted);margin-top:.4rem;"></div>

  <div class="frame-preview" id="framePreview"></div>

  <div class="error-box" id="videoErrorBox"></div>

  <button class="generate-btn" id="extractBtn" disabled onclick="extractFrames()" style="margin-top:1.75rem;">
    <div class="spinner"></div>
    <span class="btn-text">⬇ Извлечь кадры и скачать ZIP</span>
  </button>
</main>
</div><!-- /tab-video -->

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-tab active" id="navGuide" onclick="switchTab('guide')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
    Гид
  </button>
  <button class="nav-tab" id="navVideo" onclick="switchTab('video')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    YOLO Датасет
  </button>
</nav>

<script>
const GEMINI_API_KEY = 'AQ.Ab8RN6IHCj7fa-tbhrrIVMa4a12qqR-61gDA57YQPOOO-dEVzw';
const GEMINI_MODEL = 'gemini-3.1-flash-lite';
const getGeminiURL = () => `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;

let fileContent = '';
let fileLoaded = false;
let uploadedFile = null;

const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const fileInfo = document.getElementById('fileInfo');
const fileName = document.getElementById('fileName');
const removeFile = document.getElementById('removeFile');
const generateBtn = document.getElementById('generateBtn');
// API key loaded from config
const errorBox = document.getElementById('errorBox');
const resultsSection = document.getElementById('resultsSection');
const exhibitsList = document.getElementById('exhibitsList');
const resultsCount = document.getElementById('resultsCount');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  fileName.textContent = file.name;
  fileInfo.classList.add('visible');
  uploadedFile = file;
  fileLoaded = true;
  checkReady();
}

removeFile.addEventListener('click', () => {
  fileContent = '';
  fileLoaded = false;
  uploadedFile = null;
  fileInput.value = '';
  fileInfo.classList.remove('visible');
  checkReady();
});



function checkReady() {
  generateBtn.disabled = !fileLoaded;
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('visible');
}

function hideError() {
  errorBox.classList.remove('visible');
}

generateBtn.addEventListener('click', async () => {
  hideError();
  const apiKey = GEMINI_API_KEY;
  const style = document.getElementById('guideStyle').value;
  const lang = document.getElementById('outputLang').value;

  const styleDescriptions = {
    engaging: 'увлекательный, живой, с интересными фактами и риторическими вопросами',
    academic: 'академический, исторически точный, с датами и деталями',
    storytelling: 'в формате истории — как будто рассказывает очевидец или сам экспонат',
    kids: 'простой и весёлый, понятный детям 7–12 лет, с аналогиями из жизни',
    short: 'краткий, 2–3 предложения, самое важное'
  };

  const langNames = { russian: 'русском', kazakh: 'казахском', english: 'английском' };

  generateBtn.classList.add('loading');
  generateBtn.disabled = true;
  generateBtn.querySelector('.btn-text').textContent = 'Читаю файл…';

  try {
    // Extract text from file
    let docText = '';
    const isPDF = uploadedFile && uploadedFile.name.toLowerCase().endsWith('.pdf');
    if (isPDF) {
      generateBtn.querySelector('.btn-text').textContent = 'Читаю PDF…';
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const arrayBuffer = await uploadedFile.arrayBuffer();
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const maxPages = Math.min(pdfDoc.numPages, 40);
      for (let i = 1; i <= maxPages; i++) {
        const page = await pdfDoc.getPage(i);
        const tc = await page.getTextContent();
        docText += tc.items.map(it => it.str).join(' ') + '\n';
      }
    } else {
      docText = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsText(uploadedFile, 'UTF-8');
      });
    }

    if (!docText.trim()) throw new Error('Не удалось извлечь текст из файла. Попробуйте сохранить как TXT.');

    generateBtn.querySelector('.btn-text').textContent = 'Генерирую тексты…';

    const promptText = `You are a professional museum tour guide. Read the document and write spoken guide texts for each exhibit.

For each exhibit use this exact format:
===EXHIBIT===
Name: [exhibit name]
---
[3-4 paragraphs of real spoken guide text in ${langNames[lang]} language, style: ${styleDescriptions[style]}]

Repeat ===EXHIBIT=== for each exhibit found. Write real content only.

Document:
${docText.slice(0, 16000)}`;


    let statusTimer = setInterval(() => {
      const msgs = ['Генерирую тексты…', 'Обрабатываю экспонаты…', 'Почти готово…'];
      const btn = generateBtn.querySelector('.btn-text');
      btn.textContent = msgs[Math.floor(Date.now()/4000) % msgs.length];
    }, 4000);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 90000);

    const res = await fetch(`${getGeminiURL()}?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: promptText }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 4096, stopSequences: [] }
      })
    });
    clearTimeout(timeoutId);
    clearInterval(statusTimer);

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      const msg = errBody?.error?.message || errBody?.error?.status || JSON.stringify(errBody);
      throw new Error(`HTTP ${res.status}: ${msg}`);
    }

    const data = await res.json();
    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!rawText.trim()) throw new Error('Модель вернула пустой ответ. Попробуйте ещё раз.');

    // Parse plain text format: ===EXHIBIT=== blocks
    const blocks = rawText.split('===EXHIBIT===').map(b => b.trim()).filter(b => b.length > 10);
    if (blocks.length === 0) throw new Error('RAW от модели: ' + rawText.slice(0, 600));

    const exhibits = blocks.map(block => {
      const lines = block.split('\n');
      let name = '';
      let textLines = [];
      let pastDivider = false;
      for (const line of lines) {
        if (line.startsWith('Name:')) {
          name = line.replace('Name:', '').trim();
        } else if (line.trim() === '---') {
          pastDivider = true;
        } else if (pastDivider && line.trim()) {
          textLines.push(line.trim());
        }
      }
      if (!name) name = lines[0].replace('Name:', '').trim() || 'Экспонат';
      return { name, guideText: textLines.join('\n\n') };
    }).filter(e => e.guideText.length > 0);

    const parsed = { exhibits };

    if (parsed.error) throw new Error(parsed.error);
    if (!parsed.exhibits || parsed.exhibits.length === 0) {
      throw new Error('В файле не найдено информации об экспонатах. Убедитесь, что файл содержит описания музейных предметов.');
    }

    renderResults(parsed.exhibits);

  } catch (e) {
    if (e.name === 'AbortError') {
      showError('Превышено время ожидания (90 сек). Попробуйте модель Gemma 4 27B или уменьшите файл.');
    } else {
      showError('Ошибка: ' + e.message);
    }
  } finally {
    if (typeof statusTimer !== 'undefined') clearInterval(statusTimer);
    generateBtn.classList.remove('loading');
    generateBtn.disabled = false;
    generateBtn.querySelector('.btn-text').textContent = '✦ Создать тексты гида';
    checkReady();
  }
});

function renderResults(exhibits) {
  exhibitsList.innerHTML = '';
  resultsCount.textContent = `${exhibits.length} экспонат${exhibits.length === 1 ? '' : exhibits.length < 5 ? 'а' : 'ов'}`;
  resultsSection.classList.add('visible');

  exhibits.forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'exhibit-card';
    card.style.animationDelay = `${i * 0.07}s`;

    const paragraphs = ex.guideText.split(/\n+/).filter(p => p.trim()).map(p =>
      `<p class="guide-text" style="margin-bottom: 0.75rem;">${p.trim()}</p>`
    ).join('');

    card.innerHTML = `
      <div class="exhibit-header">
        <span class="exhibit-num">${String(i+1).padStart(2,'0')}</span>
        <span class="exhibit-name">${ex.name}</span>
        <button class="copy-btn" onclick="copyExhibit(this, '${encodeURIComponent(ex.guideText)}')">Копировать</button>
      </div>
      <div class="exhibit-body">${paragraphs}</div>
    `;
    exhibitsList.appendChild(card);
  });

  resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyExhibit(btn, encoded) {
  navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
    btn.textContent = '✓ Скопировано';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyAll() {
  const cards = document.querySelectorAll('.exhibit-card');
  const texts = Array.from(cards).map(card => {
    const name = card.querySelector('.exhibit-name').textContent;
    const body = Array.from(card.querySelectorAll('.guide-text')).map(p => p.textContent).join('\n\n');
    return `${name}\n\n${body}`;
  }).join('\n\n' + '─'.repeat(40) + '\n\n');
  navigator.clipboard.writeText(texts).then(() => {
    const btn = document.querySelector('.ctrl-btn');
    btn.textContent = '✓ Всё скопировано';
    setTimeout(() => btn.textContent = 'Скопировать всё', 2000);
  });
}

// ── Tab switching ──
function switchTab(tab) {
  document.getElementById('tab-guide').classList.toggle('active', tab === 'guide');
  document.getElementById('tab-video').classList.toggle('active', tab === 'video');
  document.getElementById('navGuide').classList.toggle('active', tab === 'guide');
  document.getElementById('navVideo').classList.toggle('active', tab === 'video');
}

// ── Video tab ──
let videoFile = null;

document.getElementById('videoInput').addEventListener('change', function() {
  if (this.files[0]) setVideo(this.files[0]);
});

const videoZone = document.getElementById('videoZone');
videoZone.addEventListener('dragover', e => { e.preventDefault(); videoZone.style.borderColor = 'var(--accent-light)'; });
videoZone.addEventListener('dragleave', () => { videoZone.style.borderColor = ''; });
videoZone.addEventListener('drop', e => {
  e.preventDefault(); videoZone.style.borderColor = '';
  if (e.dataTransfer.files[0]) setVideo(e.dataTransfer.files[0]);
});

function setVideo(file) {
  videoFile = file;
  document.getElementById('videoFileName').textContent = file.name;
  document.getElementById('videoFileInfo').style.display = 'flex';
  document.getElementById('extractBtn').disabled = false;
  document.getElementById('framePreview').innerHTML = '';
}

function clearVideo() {
  videoFile = null;
  document.getElementById('videoInput').value = '';
  document.getElementById('videoFileInfo').style.display = 'none';
  document.getElementById('extractBtn').disabled = true;
  document.getElementById('framePreview').innerHTML = '';
}

// Ask Gemini to find bounding box of museum exhibit in image
async function getAnnotation(blob, className) {
  const b64 = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });

  const prompt = `You are a computer vision assistant. Find the main museum exhibit or object labeled "${className}" in this image.
Return ONLY valid JSON, nothing else:
{"found": true, "cx": 0.5, "cy": 0.45, "w": 0.6, "h": 0.7}
Where cx,cy is center and w,h is size, all normalized 0.0-1.0.
If no relevant object: {"found": false}`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [
        { inline_data: { mime_type: 'image/jpeg', data: b64 } },
        { text: prompt }
      ]}],
      generationConfig: { temperature: 0, maxOutputTokens: 100 }
    })
  });
  if (!res.ok) return null;
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  try {
    // Strip markdown fences if present
    const cleaned = text.replace(/```json|```/g, '').trim();
    const m = cleaned.match(/\{[\s\S]*?\}/);
    if (m) {
      const j = JSON.parse(m[0]);
      if (j.found === true && typeof j.cx === 'number') {
        // Clamp values to 0-1
        j.cx = Math.min(1, Math.max(0, j.cx));
        j.cy = Math.min(1, Math.max(0, j.cy));
        j.w  = Math.min(1, Math.max(0.01, j.w));
        j.h  = Math.min(1, Math.max(0.01, j.h));
        return j;
      }
    }
  } catch(e) {}
  return null;
}

async function extractFrames() {
  if (!videoFile) return;
  const fps = parseInt(document.getElementById('fpsRange').value);
  const annotate = document.getElementById('annotateMode').value === 'auto';
  const className = (document.getElementById('className').value.trim() || 'exhibit').toLowerCase().replace(/\s+/g,'_');
  const btn = document.getElementById('extractBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const preview = document.getElementById('framePreview');
  const errBox = document.getElementById('videoErrorBox');

  btn.disabled = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-text').textContent = 'Загружаю видео…';
  progressWrap.style.display = 'block';
  progressFill.style.width = '0%';
  preview.innerHTML = '';
  errBox.classList.remove('visible');

  try {
    if (!window.JSZip) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }

    const url = URL.createObjectURL(videoFile);
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.src = url;

    await new Promise((res, rej) => {
      video.onloadeddata = res;
      video.onerror = () => rej(new Error('Не удалось загрузить видео'));
      setTimeout(() => rej(new Error('Таймаут загрузки видео')), 15000);
    });

    const duration = video.duration;
    const interval = 1 / fps;
    const totalFrames = Math.max(1, Math.floor(duration / interval));
    progressLabel.textContent = `Видео: ${duration.toFixed(1)}с, ~${totalFrames} кадров`;

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');

    // Collect all frames first
    const frames = []; // {blob, name}
    let frameIdx = 0;
    let currentTime = 0;

    while (currentTime <= duration) {
      await new Promise((res) => {
        let done = false;
        const tid = setTimeout(() => { if (!done) { done = true; res(); } }, 3000);
        video.onseeked = () => { if (!done) { done = true; clearTimeout(tid); res(); } };
        video.currentTime = currentTime;
      });

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
      if (blob) {
        const name = `frame_${String(frameIdx).padStart(5,'0')}`;
        frames.push({ blob, name });
        if (frameIdx < 12) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(blob);
          preview.appendChild(img);
        }
      }
      frameIdx++;
      currentTime += interval;
      progressFill.style.width = Math.min(40, Math.round((currentTime/duration)*40)) + '%';
      progressLabel.textContent = `Извлекаю кадр ${frameIdx} / ~${totalFrames}`;
      await new Promise(r => setTimeout(r, 0));
    }

    // Shuffle and split 70/20/10
    const shuffled = frames.sort(() => Math.random() - 0.5);
    const n = shuffled.length;
    const trainEnd = Math.floor(n * 0.7);
    const validEnd = trainEnd + Math.floor(n * 0.2);
    const splits = {
      train: shuffled.slice(0, trainEnd),
      valid: shuffled.slice(trainEnd, validEnd),
      test:  shuffled.slice(validEnd)
    };

    // Build ZIP with YOLO structure
    const zip = new JSZip();
    // data.yaml
    zip.file('data.yaml', `train: train/images
val: valid/images
test: test/images
nc: 1
names: ['${className}']
`);

    for (const [split, items] of Object.entries(splits)) {
      zip.folder(`${split}/images`);
      zip.folder(`${split}/labels`);
      for (let i = 0; i < items.length; i++) {
        const { blob, name } = items[i];
        zip.file(`${split}/images/${name}.jpg`, blob);

        if (annotate) {
          const pct = 40 + Math.round(((Object.values(splits).flat().indexOf(items[i])) / n) * 55);
          progressFill.style.width = pct + '%';
          progressLabel.textContent = `Разметка [${split}] ${i+1}/${items.length}…`;
          const ann = await getAnnotation(blob, className);
          if (ann) {
            const yolo = `0 ${ann.cx.toFixed(6)} ${ann.cy.toFixed(6)} ${ann.w.toFixed(6)} ${ann.h.toFixed(6)}`;
            zip.file(`${split}/labels/${name}.txt`, yolo);
          } else {
            zip.file(`${split}/labels/${name}.txt`, ''); // empty = no object
          }
          await new Promise(r => setTimeout(r, 100)); // rate limit pause
        } else {
          zip.file(`${split}/labels/${name}.txt`, '');
        }
      }
    }

    progressLabel.textContent = 'Упаковываю ZIP…';
    progressFill.style.width = '97%';

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    progressFill.style.width = '100%';

    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = `yolo_dataset_${className}_${fps}fps.zip`;
    a.click();

    progressLabel.textContent = `✓ Готово! ${frames.length} кадров: ${splits.train.length} train / ${splits.valid.length} valid / ${splits.test.length} test`;
    URL.revokeObjectURL(url);

  } catch(e) {
    errBox.textContent = 'Ошибка: ' + e.message;
    errBox.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.querySelector('.btn-text').textContent = '⬇ Извлечь кадры и скачать ZIP';
  }
}
